[project]
name = "healthai-ml"
version = "0.1.0"
description = "Model training for the AI Healthcare Demo platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "shap>=0.46",
    "joblib>=1.4",
]
 
[dependency-groups]
dev = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
]
 
