services:
  api:
    build: ./api
    container_name: healthai-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://healthai:${POSTGRES_PASSWORD}@postgres:5432/healthai
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
    volumes:
      - ./api/models:/app/models
    networks:
      - healthai-net

networks:
  healthai-net:
    external: true
